[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-indian-market-intelligence"
version = "1.0.11"
description = "Hosted Indian market intelligence API client for financial event intelligence, macro event analysis, and sector impact analysis."
readme = "PYPI_DESCRIPTION.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "AION Analytics", email = "contact@aionanalytics.in" }]
dependencies = [
  "requests>=2.31",
  "mcp>=1.27,<2"
]
keywords = [
  "india",
  "nse",
  "indian-market-intelligence",
  "macro-event-analysis",
  "sector-impact-analysis",
  "policy-impact-analysis",
  "event-driven-market-intelligence",
  "event-driven-finance",
  "economic-propagation-analysis",
  "sector-effect-modeling",
  "financial-event-analysis",
  "financial-event-intelligence",
  "financial-intelligence",
  "fintech-infrastructure",
  "market-infrastructure",
  "market-monitoring",
  "ai-agent-tooling",
  "python-sdk",
  "market-intelligence",
  "mcp-server",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
"Homepage" = "https://aionanalytics.in/models/indian-market-intelligence"
"Documentation" = "https://aionanalytics.in/docs/api-reference.txt"
"Source" = "https://github.com/AION-Analytics-India/aion-indian-market-intelligence"
"Issues" = "https://github.com/AION-Analytics-India/aion-indian-market-intelligence/issues"
"API access" = "https://aionanalytics.in/apis"
"Changelog" = "https://github.com/AION-Analytics-India/aion-indian-market-intelligence/blob/main/CHANGELOG.md"


[project.scripts]
aion-indian-market-intelligence-mcp = "aion_indian_market_intelligence.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
